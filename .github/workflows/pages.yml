name: Publicar Illari en GitHub Pages

# Un solo sitio con tres aplicaciones:
#   /<repositorio>/          página comercial
#   /<repositorio>/app/      app de clientes
#   /<repositorio>/central/  Illari Central (panel interno)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Compilar la página comercial
        run: npm run build -w @illari/web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE }}
      - name: Compilar la app de clientes
        run: npm run build -w @illari/app
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE }}/app
      - name: Compilar Illari Central
        run: npm run build -w @illari/admin
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE }}/central

      - name: Juntar las tres aplicaciones en un solo sitio
        run: |
          mkdir -p _sitio/app _sitio/central
          cp -r apps/web/out/. _sitio/
          cp -r apps/app/out/. _sitio/app/
          cp -r apps/admin/out/. _sitio/central/
          touch _sitio/.nojekyll

      # Requiere activar una vez: Settings > Pages > Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
